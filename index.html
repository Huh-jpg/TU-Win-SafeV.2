<script>

 {n:'ประตูเชียงราก 1',c:6,e:2},{n:'หอพักนักศึกษา',c:4,e:3},

 <div class="pager"><button ${winPage==1?'disabled':''} onclick="winGo(${winPage-1})">‹ ก่อนหน้า</button>${Array.from({length:tot},(_,i)=>`<button class="${i+1==winPage?'on':''}" onclick="winGo(${i+1})">${i+1}</button>`).join('')}<button ${winPage==tot?'disabled':''} onclick="winGo(${winPage+1})">ถัดไป ›</button></div>`};

async function initDb(){try{if(!(window.claude&&claude.use))return;DB=await claude.use('db');if(!DB)return;
 DB.collection('reports').onSnapshot(sn=>{const m={};sn.docs.map(d=>d.data()).sort((a,b)=>(a.ts||0)-(b.ts||0)).forEach(r=>{const k=r.plate;if(m[k]){m[k].n++;m[k].type=r.type;m[k].spot=r.spot}else m[k]={plate:r.plate,spot:r.spot,type:r.type,note:r.note,n:1}});reports=Object.values(m).reverse();if(cur=='report')drawRep();if(cur=='home')render()});
 DB.collection('posts').orderBy('ts','desc').limit(50).onSnapshot(sn=>{posts=sn.docs.map(d=>d.data());if(cur=='community')drawPosts()});

 document.querySelector('footer').textContent='ต้นแบบ (Prototype) – เรื่องร้องเรียน โพสต์ และการจองบันทึกร่วมกันทุกคน';

let ME=null,UID=null,PD=null,PRE=null,signedOut=false,afterLogin='home',loginMsg='',tmpPic=null;
const bad=m=>'<span class="tag bad">'+m+'</span>';
function av(p,z){const q=p||{};return q.pic?`<img src="${sr(q.pic)}" alt="โปรไฟล์" style="width:${z}px;height:${z}px;border-radius:50%;object-fit:cover;flex:none">`:`<span class="av" style="width:${z}px;height:${z}px;font-size:${Math.round(z/2.4)}px">${sr((q.first||'?')[0])}</span>`}
let ACC=null,ACCS=[],lmode='login';
function sync(){ME=ACC&&ACC.prof?ACC.prof:null;signedOut=false}
function saveAccs(){lsSet('accounts',ACCS);lsSet('session',ACC?ACC.user:null)}
async function hashPw(pw,salt){try{const b=new TextEncoder().encode(salt+':'+pw),h=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;const t=salt+':'+pw;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return 'x'+(h>>>0).toString(16)}}
const newSalt=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
function drawAcct(){const e=document.getElementById('acct');if(!e)return;
 e.innerHTML=ACC?`<button class="acct" onclick="go('profile')">${av(ME||{first:ACC.user},30)}${sr(ME?ME.first:ACC.user)}</button>`:`<button class="acct in" onclick="lmode='login';go('login')">เข้าสู่ระบบ</button>`}
function need(){if(ACC&&ME)return true;afterLogin=cur;if(ACC){loginMsg='กรุณากรอกโปรไฟล์ให้ครบก่อนใช้งาน';go('profile')}else{loginMsg='กรุณาเข้าสู่ระบบก่อนใช้งานฟังก์ชันนี้';lmode='login';go('login')}return false}
const anote='<div class="note">ต้นแบบ: บัญชีและโปรไฟล์เก็บในเบราว์เซอร์เครื่องนี้เท่านั้น ยังไม่ได้ยืนยันอีเมลกับ Google</div>';
function pform(p,btn){return `<div class="card"><div class="row" style="justify-content:flex-start;flex-wrap:nowrap;gap:14px"><div id="pfimg">${av(p,72)}</div><div style="flex:1"><label style="margin-top:0">🖼️ รูปโปรไฟล์</label><input type="file" id="pff" accept="image/jpeg,image/png,image/webp" onchange="pickPic(this)"></div></div>
<label>ชื่อ</label><input id="pf1" value="${sr(p.first)}"><label>นามสกุล</label><input id="pf2" value="${sr(p.last)}">
<label>Gmail</label><input id="pf3" type="email" value="${sr(p.email)}" placeholder="example@gmail.com">
<p><button class="btn" onclick="saveProfile()">${btn}</button></p><div id="pfm"></div></div>`}
const pnote='<div class="note">ต้นแบบ: ยังไม่ได้ยืนยัน Gmail ผ่าน Google จริง ระบบผูกโปรไฟล์กับบัญชี Claude ที่เปิดหน้านี้ และเก็บโปรไฟล์แบบส่วนตัวเฉพาะคุณ</div>';
V.login=()=>{if(ACC)return V.profile();const msg=loginMsg;loginMsg='';
 const head=`<div class="banner"><span>🔐</span><div><h2>${lmode=='reg'?'สมัครสมาชิก':'เข้าสู่ระบบ'}</h2>${msg?`<div class="mu">${sr(msg)}</div>`:''}</div></div>`;

 return head+`<div class="card" style="max-width:420px"><label>ชื่อผู้ใช้ / Gmail</label><input id="lg_u" autocomplete="username"><label>รหัสผ่าน</label><input id="lg_p" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"><p><button class="btn" onclick="doLogin()">เข้าสู่ระบบ</button></p><div id="lgm"></div>

 <div id="fgt" class="fgt" hidden><label style="margin-top:0">Gmail ของบัญชี</label><input id="fg_e" type="email"><label>รหัสผ่านใหม่</label><input id="fg_p" type="password" autocomplete="new-password"><p><button class="btn sec" onclick="doForgot()">ตั้งรหัสผ่านใหม่</button></p><div id="fgm"></div><div class="mu" style="font-size:12px">ต้นแบบ: ยังไม่ได้ส่งอีเมลยืนยัน ในระบบจริงจะส่งลิงก์รีเซ็ตไปที่ Gmail</div></div>

V.loginInit=V.profileInit=()=>{tmpPic=null};
function pickPic(inp){const f=inp.files[0];if(!f)return;
 if(!/^image\/(jpeg|png|webp)$/.test(f.type)){$('pfm').innerHTML=bad('รองรับเฉพาะไฟล์ JPG, PNG, WEBP');inp.value='';return}
 const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const k=Math.min(im.width,im.height);

async function doLogin(){const u=$('lg_u').value.trim().toLowerCase(),p=$('lg_p').value,m=$('lgm');
 if(!u||!p){m.innerHTML=bad('กรอกชื่อผู้ใช้/Gmail และรหัสผ่าน');return}
 const a=ACCS.find(x=>x.user==u||x.email==u);
 if(!a||await hashPw(p,a.salt)!==a.hash){m.innerHTML=bad('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');return}
 ACC=a;sync();saveAccs();drawAcct();loginMsg=ME?'':'กรุณากรอกโปรไฟล์ให้ครบ';go('profile')}
async function doReg(){const u=$('rg_u').value.trim().toLowerCase(),e=$('rg_e').value.trim().toLowerCase(),p=$('rg_p').value,p2=$('rg_p2').value,m=$('lgm');
 if(!/^[a-z0-9_.]{3,20}$/.test(u)){m.innerHTML=bad('ชื่อผู้ใช้ 3–20 ตัว ใช้ a-z 0-9 _ . เท่านั้น');return}

<label>🖼️ แนบรูป (ไม่บังคับ)</label><input type="file" id="cfile" accept="image/jpeg,image/png,image/webp" onchange="pickPostImg(this)">
<div id="cprev" style="margin-top:8px"></div><p><button class="btn" onclick="addPost2()">โพสต์</button></p></div><div id="posts"></div>`;
V.communityInit=()=>{cimg='';drawFeed()};
function insEmo(id,e){const el=$(id);if(!el)return;el.value+=e;el.focus()}
function shrink(f,max,cb,err){if(!/^image\/(jpeg|png|webp)$/.test(f.type))return err('รองรับเฉพาะ JPG, PNG, WEBP');if(f.size>8*1024*1024)return err('ไฟล์ใหญ่เกิน 8 MB');
 const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72))};im.onerror=()=>err('เปิดรูปไม่ได้');im.src=r.result};r.readAsDataURL(f)}
function pickPostImg(inp){const f=inp.files[0];cimg='';$('cprev').innerHTML='';if(!f)return;shrink(f,800,d=>{cimg=d;$('cprev').innerHTML=`<img class="pimg" src="${d}" alt="ตัวอย่างรูป">`},m=>{$('cprev').innerHTML=bad(m);inp.value=''})}
function addPost2(){if(!need())return;const x=$('cx').value.trim();if(!x&&!cimg){toast('พิมพ์ข้อความหรือแนบรูปก่อน');return}
 posts.unshift({id:'p'+Date.now().toString(36),t:$('ct').value,u:ME.first+' '+((ME.last||'')[0]||'')+'.',by:uname(),x,img:cimg||'',ts:Date.now(),likes:[],rx:{},cm:[],sh:0});savePosts();cimg='';$('cx').value='';$('cfile').value='';$('cprev').innerHTML='';drawFeed()}
function rxSum(p){const c={};Object.values(p.rx).forEach(e=>c[e]=(c[e]||0)+1);return Object.keys(c).map(e=>e+c[e]).join(' ')}
function drawFeed(){const el=$('posts');if(!el)return;const me=uname();
 el.innerHTML=posts.length?posts.map(p=>{const id=p.id,liked=p.likes.includes(me),mine=p.rx[me];return `<div class="card post">
 <div class="row" style="justify-content:flex-start;flex-wrap:nowrap;gap:10px">${av({first:(p.u||'?')[0]},38)}<div><b>${sr(p.u)}</b> <span class="tag">${sr(p.t)}</span><div class="mu" style="font-size:12px">${ago(p.ts||Date.now())}</div></div></div>
 ${p.x?`<div class="ptxt">${sr(p.x)}</div>`:''}${okImg(p.img)?`<img class="pimg" src="${p.img}" alt="รูปในโพสต์">`:''}
 <div class="mu pst">👍 ${p.likes.length}${rxSum(p)?' · '+rxSum(p):''} · 💬 ${p.cm.length} · ↗️ ${p.sh}</div>
 <div class="acts"><button class="${liked?'on':''}" onclick="likeP('${id}')">👍 ถูกใจ</button><button class="${mine?'on':''}" onclick="toggleBox('rx','${id}')">${mine||'😊'} อิโมจิ</button><button onclick="toggleBox('cm','${id}')">💬 คอมเมนต์</button><button onclick="shareP('${id}')">↗️ แชร์</button></div>
 <div class="emrow" id="rx-${id}" hidden>${EMO.map(e=>`<button onclick="reactP('${id}','${e}')">${e}</button>`).join('')}</div>
 <div id="cm-${id}" class="cmbox" ${ocm.has(id)?'':'hidden'}>${p.cm.map(c=>`<div class="cmt"><b>${sr(c.u)}</b> ${sr(c.x)} <span class="mu" style="font-size:11px">${ago(c.ts)}</span></div>`).join('')}
 <div style="display:flex;gap:6px;margin-top:6px"><input id="ci-${id}" placeholder="เขียนคอมเมนต์..." onkeydown="if(event.key==='Enter')addCm('${id}')"><button class="btn" onclick="addCm('${id}')">ส่ง</button></div>
 <div class="emrow">${QE.map(e=>`<button onclick="insEmo('ci-${id}','${e}')">${e}</button>`).join('')}</div></div></div>`}).join(''):'<div class="mu">ยังไม่มีโพสต์</div>'}
function likeP(id){if(!need())return;const p=gp(id),me=uname(),i=p.likes.indexOf(me);if(i>=0)p.likes.splice(i,1);else p.likes.push(me);savePosts();drawFeed()}
function toggleBox(k,id){if(k=='cm'){if(ocm.has(id))ocm.delete(id);else ocm.add(id);drawFeed()}else{const e=$('rx-'+id);e.hidden=!e.hidden}}
function reactP(id,e){if(!need())return;const p=gp(id),me=uname();if(p.rx[me]==e)delete p.rx[me];else p.rx[me]=e;savePosts();drawFeed()}
function addCm(id){if(!need())return;const i=$('ci-'+id),x=i.value.trim();if(!x)return;gp(id).cm.push({u:ME.first,x,ts:Date.now()});ocm.add(id);savePosts();drawFeed();const n=$('ci-'+id);if(n)n.focus()}
async function shareP(id){const p=gp(id),text=(p.u+': '+(p.x||'รูปภาพ')).slice(0,200),url=location.href;try{if(navigator.share)await navigator.share({title:'TU Win Safe',text,url});else{await navigator.clipboard.writeText(text+'\n'+url);toast('คัดลอกข้อความและลิงก์แล้ว')}p.sh++;savePosts();drawFeed()}catch(e){}}

const SP=[['ประตูเชียงราก 1',258,52],['หอพักนักศึกษา',68,262],['คณะวิศวกรรมศาสตร์',457,345],['โรงอาหาร SC',500,168],['โรงอาหาร green',238,138],['ตึกเรียนรวม SC',546,122]];
let riders=null,selR=null;
function initRiders(){riders=drivers.filter(d=>!d.ban).map((d,i)=>{const j=hs(d.id),h=i%SP.length,ox=(j%31)-15,oy=((j>>5)%31)-15;return{d,home:h,ox,oy,x:SP[h][1]+ox,y:SP[h][2]+oy,tx:0,ty:0,mode:'idle',to:-1}})}
function tick(){if(!riders)initRiders();
 riders.forEach(r=>{if(r.mode=='idle'){if(Math.random()<.07){const t=Math.floor(Math.random()*SP.length);if(t!=r.home){r.to=t;r.tx=SP[t][1]+r.ox;r.ty=SP[t][2]+r.oy;r.mode='trip'}}else{r.x=SP[r.home][1]+r.ox+rnd(2);r.y=SP[r.home][2]+r.oy+rnd(2)}}
  else{const dx=r.tx-r.x,dy=r.ty-r.y,dist=Math.hypot(dx,dy);if(dist<12){r.mode='idle';r.home=r.to;r.x=r.tx;r.y=r.ty}else{r.x+=dx/dist*14;r.y+=dy/dist*14}}});
 spots.forEach((s,i)=>{const idle=riders.filter(r=>r.mode=='idle'&&r.home==i);s.c=idle.length;
  const inc=riders.filter(r=>r.mode=='trip'&&r.to==i).map(r=>Math.hypot(r.tx-r.x,r.ty-r.y));
  s.e=s.c?2+(hs(s.n+Math.floor(Date.now()/60000))%3):inc.length?Math.max(1,Math.ceil(Math.min.apply(null,inc)/14)):8})}
V.live=()=>`<h2><span class="dot"></span> วินเรียลไทม์ (จำลอง)</h2><div class="mu">แผนที่ธรรมศาสตร์ ศูนย์รังสิต · แต่ละจุดคือพี่วิน 1 คน อัปเดตทุก 2 วินาที · ตำแหน่งจุดรับเป็นค่าประมาณของต้นแบบ</div>

function showR(){const r=riders[selR],d=r.d,idle=r.mode=='idle';
 $('rinfo').innerHTML=`<div class="row"><div><b>${sr(d.id)} · ${sr(d.name)}</b> <span class="tag ${idle?'ok':'w'}">${idle?'ว่าง':'กำลังเดินทาง'}</span><div class="mu">${sr(d.plate)} · ${sr(d.bike)}</div><div class="mu">${idle?'รออยู่ที่ <b>'+sr(SP[r.home][0])+'</b>':'กำลังไปที่ <b>'+sr(SP[r.to][0])+'</b> (ไม่ว่างชั่วคราว)'}</div><div class="mu">ความปลอดภัย ${d.safe}/100</div></div><button class="btn" onclick="preCode='${d.id}';go('book')">จองคนนี้</button></div>`}
function selRider(i){selR=i;paintMap()}
function paintMap(){if(!$('mapdots'))return;riders.forEach((r,i)=>{const e=$('rd'+i);if(!e)return;e.style.left=(r.x/9.54)+'%';e.style.top=(r.y/5.7)+'%';e.className='rd '+(r.mode=='idle'?'g':'o')+(selR==i?' sel':'')});
 $('spots').innerHTML=spots.map(s=>`<div class="card"><h3>${sr(s.n)}</h3><div class="big">${s.c} <span class="mu">คัน</span></div><div>${s.c?`วินมาถึงใน ~<b>${s.e}</b> นาที`:`<span class="tag w">ไม่มีวินว่าง</span> <span class="mu">คันถัดไป ~${s.e} นาที</span>`}</div></div>`).join('');
 if(selR!=null)showR()}
V.liveInit=()=>{if(!riders)initRiders();selR=null;
 $('mapdots').innerHTML=SP.map(s=>`<span class="mchip" style="left:${s[1]/9.54}%;top:${s[2]/5.7}%">📍 ${sr(s[0])}</span>`).join('')+riders.map((r,i)=>`<button class="rd" id="rd${i}" aria-label="${sr(r.d.id)}" onclick="selRider(${i})"></button>`).join('');
 paintMap();clearInterval(timer);timer=setInterval(()=>{if(!$('mapdots')){clearInterval(timer);return}tick();paintMap()},2000)};

const pts=()=>ACC?(ACC.pts==null?100:ACC.pts):0;
function homeAds(){return `<div class="row" style="margin:14px 0 6px"><h2 style="margin:0">🎟️ คูปอง &amp; สิทธิพิเศษ</h2><div class="mu">${ACC?`แต้มของคุณ <b>${pts()}</b> แต้ม · จองวินได้ +10 แต้ม`:`<a href="#" onclick="lmode='login';go('login');return false" style="color:var(--pr);font-weight:600">เข้าสู่ระบบ</a> เพื่อรับ 100 แต้มต้อนรับ`}</div></div>
<div class="cwrap"><button class="car l" onclick="scrollAds(-1)" aria-label="ก่อนหน้า">‹</button><div id="ads" class="ads">${CPN.map((c,i)=>`<div class="ad" style="background:linear-gradient(135deg,${c.bg})"><div class="ade">${c.e}</div><b>${sr(c.t)}</b><div class="adm">${sr(c.d)}</div><div class="adf"><span>${c.c} แต้ม</span><button class="btn" onclick="redeem(${i})">แลกสิทธิ์</button></div></div>`).join('')}</div><button class="car r" onclick="scrollAds(1)" aria-label="ถัดไป">›</button></div>
${ACC&&ACC.cps&&ACC.cps.length?`<div class="card" style="margin-top:10px"><h3>🎫 คูปองของฉัน</h3>${ACC.cps.slice(0,8).map(c=>`<div class="row"><span>${sr(c.t)}</span><code>${sr(c.code)}</code></div>`).join('')}</div>`:''}
<h2 style="margin-top:18px">บริการของเรา</h2>`}
const _home=V.home;
function scrollAds(d){const a=$('ads');if(a)a.scrollBy({left:d*(a.firstElementChild.offsetWidth+12),behavior:'smooth'})}
function redeem(i){if(!need())return;const c=CPN[i];if(pts()<c.c){toast('แต้มไม่พอ ต้องใช้ '+c.c+' แต้ม');return}
 const code='TU'+Math.random().toString(36).slice(2,8).toUpperCase();ACC.pts=pts()-c.c;ACC.cps=ACC.cps||[];ACC.cps.unshift({t:c.t,code,ts:Date.now()});saveAccs();toast('แลกสำเร็จ! รหัส '+code);
 const a=$('ads'),sl=a?a.scrollLeft:0;render();const b=$('ads');if(b)b.scrollLeft=sl}
let adT=0,adLast=0;
V.homeInit=()=>{clearInterval(adT);const a=$('ads');if(!a)return;['pointerdown','wheel','touchstart','mouseenter'].forEach(ev=>a.addEventListener(ev,()=>{adLast=Date.now()},{passive:true}));
 adT=setInterval(()=>{const k=$('ads');if(!k){clearInterval(adT);return}if(Date.now()-adLast<8000)return;const w=k.firstElementChild.offsetWidth+12;k.scrollBy({left:k.scrollLeft+w>=k.scrollWidth-k.clientWidth-4?-k.scrollLeft:w,behavior:'smooth'})},4000)};
const RT=lsGet('ratings')||{};
const rateOf=d=>{const r=RT[d.id]||[0,0];return ((+d.rate*10+r[0])/(10+r[1])).toFixed(1)};
function maxDef(){const n=new Date(Date.now()+60*86400000),p=x=>String(x).padStart(2,'0');return n.getFullYear()+'-'+p(n.getMonth()+1)+'-'+p(n.getDate())}
let rateSel=0,rateTags=[];
const RTAGS=['ขับปลอดภัย','สุภาพ','รถสะอาด','ตรงเวลา','ขับเร็วเกินไป'];
const starStr=n=>'★'.repeat(n)+'☆'.repeat(5-n);
function arrived(){const b=booking;if(!b)return;b.done=true;if(b.hr){b.hr.done=true;b.hr.doneTs=Date.now()}rateSel=0;rateTags=[];saveAccs();$('bres').innerHTML=bookView();toast('ถึงที่หมายแล้ว 🎉')}
function doneView(b){const h=b.hr||{};
 if(h.rating)return `<div class="card" style="border-color:var(--ok)"><span class="tag ok">เสร็จสิ้นการเดินทาง</span><h3>รหัส ${sr(b.d.id)} – ${sr(b.d.name)}</h3><div style="color:#f2b705;font-size:28px">${starStr(h.rating)}</div>${(h.tags&&h.tags.length)?`<div class="mu">${h.tags.map(sr).join(' · ')}</div>`:''}${h.cmt?`<div class="mu">"${sr(h.cmt)}"</div>`:''}<p>ขอบคุณที่ให้คะแนน 🙏</p><button class="btn" onclick="booking=null;chat={b:null,msgs:[]};go('book')">จองใหม่</button> <button class="btn sec" onclick="go('hist')">ดูประวัติ</button></div>`;
 return `<div class="card" style="border-color:var(--ok)"><span class="tag ok">ถึงที่หมายแล้ว 🎉</span><h3>${sr(b.d.name)}</h3><div class="mu">รหัส ${sr(b.d.id)} · ${sr(b.d.plate)}</div><p>ให้คะแนนพี่วินคนนี้</p>
 <div id="stars" class="stars">${[1,2,3,4,5].map(n=>`<button onclick="setStar(${n})">${n<=rateSel?'★':'☆'}</button>`).join('')}</div>
 <div style="margin:6px 0">${RTAGS.map((t,i)=>`<button class="rtag ${rateTags.includes(t)?'on':''}" onclick="togTag(${i})">${t}</button>`).join('')}</div>
 <textarea id="rcm" rows="2" placeholder="ความคิดเห็นเพิ่มเติม (ไม่บังคับ)"></textarea><p><button class="btn" onclick="sendRating()">ส่งคะแนน</button></p></div>`}
function setStar(n){rateSel=n;document.querySelectorAll('#stars button').forEach((e,i)=>e.textContent=i<n?'★':'☆')}
function togTag(i){const t=RTAGS[i],k=rateTags.indexOf(t);k<0?rateTags.push(t):rateTags.splice(k,1);document.querySelectorAll('.rtag').forEach((e,j)=>e.classList.toggle('on',rateTags.includes(RTAGS[j])))}
function sendRating(){if(!rateSel){toast('กรุณาเลือกจำนวนดาวก่อน');return}const b=booking,h=b.hr;if(!h)return;
 h.rating=rateSel;h.tags=rateTags.slice();h.cmt=($('rcm').value||'').trim().slice(0,200);
 const r=RT[b.d.id]=RT[b.d.id]||[0,0];r[0]+=rateSel;r[1]++;lsSet('ratings',RT);saveAccs();$('bres').innerHTML=bookView();toast('ส่งคะแนนแล้ว ขอบคุณครับ')}
V.hist=()=>{const top=`<p><button class="btn sec" onclick="go('book')">← กลับไปจองวิน</button></p><div class="banner"><span>🕘</span><div><h2>ประวัติการใช้บริการ</h2><div class="mu">พี่วินที่คุณเคยใช้บริการ</div></div></div>`;
 if(!ACC)return top+`<div class="card">กรุณา<a href="#" onclick="lmode='login';go('login');return false" style="color:var(--pr);font-weight:600">เข้าสู่ระบบ</a>เพื่อดูประวัติ</div>`;
 const h=ACC.hist||[];if(!h.length)return top+'<div class="card mu">ยังไม่มีประวัติ จองวินครั้งแรกได้ที่หน้าจองวิน</div>';
 const by={};h.forEach(x=>{(by[x.id]=by[x.id]||[]).push(x)});
 const cards=Object.keys(by).map(id=>{const l=by[id],d=drivers.find(z=>z.id==id)||{name:l[0].name,plate:l[0].plate},rs=l.filter(x=>x.rating).map(x=>x.rating);
  return `<div class="card"><div class="row" style="flex-wrap:nowrap;justify-content:flex-start;gap:10px">${av({first:(d.name||'?').replace('พี่','')[0]},40)}<div style="flex:1"><b>${sr(id)} · ${sr(d.name)}</b><div class="mu">${sr(d.plate)}</div><div class="mu">ใช้บริการ ${l.length} ครั้ง · ล่าสุด ${sr(l[0].date)}${rs.length?' · คะแนนที่คุณให้เฉลี่ย ⭐ '+(rs.reduce((a,b)=>a+b,0)/rs.length).toFixed(1):''}</div></div><button class="btn" onclick="preCode='${sr(id)}';go('book')">จองอีกครั้ง</button></div></div>`}).join('');
 return top+`<h3>พี่วินที่เคยใช้บริการ (${Object.keys(by).length} คน)</h3><div class="grid">${cards}</div><h3 style="margin-top:14px">ทริปทั้งหมด</h3><div class="scroll"><table><tr><th>วันที่</th><th>พี่วิน</th><th>เส้นทาง</th><th>สถานะ</th><th>ชำระเงิน</th><th>คะแนน</th></tr>${h.map(x=>`<tr><td>${sr(x.date)} ${sr(x.time)}</td><td>${sr(x.id)} ${sr(x.name)}</td><td>${sr(x.f)} → ${sr(x.t)}</td><td>${x.done?'<span class="tag ok">เสร็จสิ้น</span>':'<span class="tag w">จองแล้ว</span>'}</td><td>${payTag(x.pay)}</td><td>${x.rating?'<span style="color:#f2b705">'+starStr(x.rating)+'</span>':'-'}</td></tr>`).join('')}</table></div>`};

const socHtml=()=>`<div class="card" style="max-width:420px;margin-top:10px"><div class="mu" style="text-align:center;margin-bottom:8px">หรือเข้าสู่ระบบด้วย</div><div class="soc">${Object.keys(SOC).map(k=>`<button onclick="socOpen('${k}')"><img src="${LOGO[k]}" alt=""><span>${SOC[k].n}</span></button>`).join('')}</div></div><div class="small" style="max-width:420px;text-align:center;margin-top:12px"><a href="#" onclick="go('dlogin');return false">🏍️ เข้าสู่ระบบสำหรับพี่วิน (ผู้ขับขี่)</a></div>`;
function closeOv(){const o=document.getElementById('ov');if(o)o.remove()}
function socOpen(k){closeOv();const p=SOC[k],o=document.createElement('div');o.className='ov full';o.id='ov';
 o.innerHTML=`<div class="ovc full"><img src="${LOGO[k]}" style="width:96px;height:96px;border-radius:22px" alt=""><h2 style="margin:12px 0 4px">เข้าสู่ระบบด้วย ${p.n}</h2><div class="mu">หน้าจำลองสำหรับต้นแบบ ไม่ได้เชื่อมต่อกับ ${p.n} จริง</div>
 <div class="card" style="margin:16px 0;min-width:270px;text-align:left"><div class="mu" style="margin-bottom:6px">บัญชีทดลอง</div><div class="row" style="justify-content:flex-start;gap:10px;flex-wrap:nowrap">${av({first:p.first,pic:LOGO[k]},44)}<div><b>${sr(p.first)} ${sr(p.last)}</b><div class="mu">${sr(p.email)}</div></div></div></div>
 <div class="mu" style="max-width:340px">เว็บนี้จะได้รับชื่อ รูปโปรไฟล์ และอีเมลของบัญชีทดลองนี้ แล้วเข้าสู่ระบบให้อัตโนมัติ</div>
 <p><button class="btn" onclick="socOk('${k}')">ยืนยัน</button> <button class="btn sec" onclick="closeOv()">ยกเลิก</button></p></div>`;document.body.appendChild(o)}
function socOk(k){const p=SOC[k];closeOv();let a=ACCS.find(x=>x.user==p.u);
 if(!a){a={user:p.u,email:p.email,salt:'',hash:'',prov:k,prof:{first:p.first,last:p.last,email:p.email,pic:LOGO[k],ts:Date.now()}};ACCS.push(a)}
 ACC=a;sync();saveAccs();drawAcct();toast('เข้าสู่ระบบด้วย '+p.n+' แล้ว');loginMsg='';go('profile')}

function heatTick(){const h=new Date().getHours();if(Math.random()<(h>=6&&h<22?.5:.1)){let r=Math.random()*SW.reduce((a,b)=>a+b),s=0;while(r>=SW[s]){r-=SW[s];s++}LIVE.push({ts:Date.now(),s,k:Math.random()<.6?s%3:Math.floor(Math.random()*3)});if(LIVE.length>200)LIVE.shift()}}
const agoT=ts=>{const m=Math.floor((Date.now()-ts)/60000);return m<1?'เมื่อสักครู่':m<60?m+' นาทีที่แล้ว':Math.floor(m/60)+' ชั่วโมงที่แล้ว'};
const kName=k=>k<0?'อื่น ๆ':HK[k];
function setHk(k){hk=k;document.querySelectorAll('[data-hk]').forEach(b=>b.classList.toggle('on',b.dataset.hk==k));paintHeat()}
function setHw(k){hwin=k;document.querySelectorAll('[data-hw]').forEach(b=>b.classList.toggle('on',b.dataset.hw==k));paintHeat()}
function hSel(i){hsel=hsel==i?-1:i;paintHeat()}
function stHeat(){const pb=(a,v,f,l)=>`<button data-${a}="${v}" class="${f==v?'on':''}" onclick="${a=='hk'?'setHk':'setHw'}('${v}')">${l}</button>`;
 return `<div class="card"><div class="row"><h3><span class="dot"></span> แผนที่จุดเสี่ยง (เรียลไทม์)</h3><span class="tag w" id="hsum"></span></div>
<div class="stabs">${[['all','ทั้งหมด']].concat(HK.map(k=>[k,k])).map(x=>pb('hk',x[0],hk,x[1])).join('')}</div>
<div class="stabs">${[['1h','1 ชั่วโมง'],['day','24 ชั่วโมง'],['7d','7 วัน']].map(x=>pb('hw',x[0],hwin,x[1])).join('')}</div>
<div class="mapwrap"><img src="${MAPIMG}" alt="แผนที่ธรรมศาสตร์ รังสิต" draggable="false"><div id="heat"></div></div>
<div class="hleg"><span>ความเสี่ยงต่ำ</span><i></i><span>ความเสี่ยงสูง</span></div><div class="mu" style="font-size:12px">ข้อมูลจำลอง + ข้อร้องเรียนที่ส่งเข้ามาในระบบ · อัปเดตทุก 3 วินาที · แตะตัวเลขบนแผนที่เพื่อดูรายละเอียดของจุดนั้น</div></div>
<div id="hdet"></div><div class="card" style="margin-top:12px"><h3>🔝 3 จุดเสี่ยงสุด</h3><div id="htop"></div></div><div class="card" style="margin-top:12px"><h3>🔴 เหตุการณ์ล่าสุด</h3><div id="hfeed"></div></div>`}
function paintHeat(){if(!$('heat'))return;const now=Date.now(),W=HWIN[hwin],I=incR(now-W,now),cnt=SP.map(()=>0);I.forEach(x=>cnt[x.s]++);const mx=Math.max(1,...cnt),prev=incR(now-2*W,now-W).length;
 $('heat').innerHTML=SP.map((s,i)=>{const f=cnt[i]/mx,hue=Math.round(55-f*55),fresh=I.some(x=>x.s==i&&now-x.ts<9000),p=`left:${s[1]/9.54}%;top:${s[2]/5.7}%`;
  return `<div class="hb" style="${p};width:${18+f*26}%;background:radial-gradient(circle,hsla(${hue},95%,48%,${(.3+f*.55).toFixed(2)}) 0%,hsla(${hue},95%,48%,0) 70%)"></div><button class="hc ${fresh?'fresh':''} ${hsel==i?'sel':''}" style="${p}" aria-label="${sr(s[0])} ${cnt[i]}" onclick="hSel(${i})">${cnt[i]}</button><span class="hl" style="${p}">${sr(s[0])}</span>`}).join('');
 const d=I.length-prev;$('hsum').textContent=I.length+' เหตุการณ์'+(prev?' · '+(d>=0?'▲ ':'▼ ')+Math.abs(Math.round(d/prev*100))+'% เทียบช่วงก่อนหน้า':'');
 const kc=(i,list)=>HK.map((k,j)=>[k,list.filter(x=>x.s==i&&x.k==j).length]).concat([['อื่น ๆ',list.filter(x=>x.s==i&&x.k<0).length]]),peak=(i,list)=>{const h={};list.filter(x=>x.s==i).forEach(x=>{const k=new Date(x.ts).getHours();h[k]=(h[k]||0)+1});const t=Object.entries(h).sort((a,b)=>b[1]-a[1])[0];return t?String(t[0]).padStart(2,'0')+':00':'-'};
 $('htop').innerHTML=SP.map((s,i)=>i).sort((a,b)=>cnt[b]-cnt[a]).slice(0,3).map((i,r)=>{const k=kc(i,I).sort((a,b)=>b[1]-a[1])[0];return `<div class="row"><span><b>${r+1}. ${sr(SP[i][0])}</b><div class="mu">${cnt[i]?'เด่น: '+k[0]+' · เวลาที่เกิดบ่อย '+peak(i,I)+' น.':'ยังไม่มีเหตุการณ์'}</div></span><span class="tag ${r==0?'bad':'w'}">${cnt[i]} เหตุการณ์</span></div>`}).join('');
 $('hfeed').innerHTML=[...I].sort((a,b)=>b.ts-a.ts).slice(0,6).map(x=>`<div class="row"><span>${kName(x.k)} · ${sr(SP[x.s][0])}</span><span class="mu">${agoT(x.ts)}</span></div>`).join('')||'<div class="mu">ไม่มีเหตุการณ์ในช่วงนี้</div>';
 if(hsel>=0){const A=incR(now-W,now,true),k=kc(hsel,A),m=Math.max(1,...k.map(x=>x[1]));$('hdet').innerHTML=`<div class="card" style="margin-top:12px;border-color:var(--pr)"><h3>📍 ${sr(SP[hsel][0])}</h3><div class="mu">${A.filter(x=>x.s==hsel).length} เหตุการณ์ · เวลาที่เกิดบ่อย ${peak(hsel,A)} น.</div>${k.map(x=>`<div class="row"><span>${x[0]}</span><b>${x[1]}</b></div><div class="bar"><i style="width:${Math.round(x[1]/m*100)}%"></i></div>`).join('')}</div>`}else $('hdet').innerHTML=''}
V.statsInit=()=>{clearInterval(timer);if(stab=='e'){paintHeat();timer=setInterval(()=>{if(!$('heat')){clearInterval(timer);return}heatTick();paintHeat()},3000)}};
(function(){const st=document.createElement('style');st.textContent=`.hb{position:absolute;transform:translate(-50%,-50%);aspect-ratio:1;border-radius:50%;pointer-events:none;transition:all .8s}#heat{position:absolute;inset:0}.hc{position:absolute;transform:translate(-50%,-50%);min-width:28px;height:28px;border-radius:99px;border:2px solid #fff;background:rgba(150,0,20,.9);color:#fff;font:700 13px/1 inherit;cursor:pointer;padding:0 6px;z-index:2;box-shadow:0 1px 4px rgba(0,0,0,.5)}.hc.sel{outline:3px solid var(--ac)}.hc.fresh{animation:hp 1s ease-out 3}@keyframes hp{0%{box-shadow:0 0 0 0 rgba(220,38,38,.8)}100%{box-shadow:0 0 0 18px rgba(220,38,38,0)}}.hl{position:absolute;transform:translate(-50%,18px);background:rgba(255,255,255,.88);color:#222;font:600 10px/1.2 inherit;padding:1px 5px;border-radius:6px;white-space:nowrap;pointer-events:none;z-index:1}.hleg{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:6px}.hleg i{flex:1;height:8px;border-radius:99px;background:linear-gradient(90deg,#f5c400,#f08a00,#d11a1a)}`;document.head.appendChild(st)})();

let pendI=-1;

 return `<label>วิธีชำระเงิน</label><div class="pill">${opt('wallet','👛','กระเป๋า TU Win','คงเหลือ '+baht(w.bal))}${opt('card','💳','บัตรทดลอง',w.card?'•••• '+w.card.last4:'ยังไม่ได้ผูกบัตร — จะผูกบัตรทดลองให้เมื่อเลือก')}${opt('cash','💵','เงินสด','จ่ายพี่วินตอนถึงที่หมาย')}</div>
 ${m=='wallet'&&w.bal<fr?`<div class="note">ยอดไม่พอ ขาดอีก ${baht(fr-w.bal)} <button class="btn sec" onclick="openTopup(${Math.max(50,Math.ceil((fr-w.bal)/50)*50)})">เติมเงิน</button></div>`:''}
 <div class="mu" style="font-size:12px">${m=='cash'?'เงินสด: ไม่ผ่านแอป ชำระกับพี่วินโดยตรงตอนถึงที่หมาย':'กันวงเงินตอนจอง และตัดจริงเมื่อกดถึงแล้ว ยกเลิกก่อนถึงได้เงินคืนเต็มจำนวน ไม่ต้องสแกนและไม่ต้องเปิดแอปอื่น'}</div>`}
function setPm(k){const w=W();if(!w)return;if(k=='card'&&!w.card)w.card={last4:'4242'};w.m=k;saveAccs();if(cur=='wallet')render();else if(pendI>=0&&$('payopt'))pick(pendI)}

const _pick=pick;
pick=function(i){if(!need())return;pendI=i;const q=lastQ,d=drivers[i],fr=fareOf(q.f,q.t),w=W(),cash=w.m=='cash',ok=cash||w.m=='card'||w.bal>=fr;
 $('bres').innerHTML=`<div class="card" style="border-color:var(--ac)"><span class="tag w">ตรวจสอบก่อนยืนยันจอง</span><h3>${d.id} – ${sr(d.name)} · ${sr(d.plate)}</h3><div class="mu">${sr(d.bike)}</div>
<p>📍 ${sr(q.f)} → ${sr(q.t)}<br>📅 ${thDate(q.date,q.time)} เวลา ${sr(q.time)} น.</p>
<div class="fare"><div class="mu">ค่าโดยสารโดยประมาณ (${sr(q.f)} → ${sr(q.t)})</div><div class="big">฿${fr}</div><div class="mu">ราคาโดยประมาณ ยังไม่มีการเรียกเก็บจนกว่าจะยืนยันจอง</div></div>
<div style="margin-bottom:8px">${qTag(qInfo(d,q.date,q.time))}</div><div id="payopt">${payBox(fr)}</div>
<p><button class="btn" ${ok?'':'disabled style="opacity:.5"'} onclick="pickGo(${i})">✅ ${cash?'ยืนยันและจอง':'ยืนยันและชำระเงิน'} ${baht(fr)}</button> <button class="btn sec" onclick="doBook()">← เลือกใหม่</button></p></div>`};
function pickGo(i){const w=W();if(!w||!need())return;const q=lastQ,fr=fareOf(q.f,q.t),m=w.m;
 if(m=='wallet'&&w.bal<fr){toast('ยอดเงินในกระเป๋าไม่พอ');pick(i);return}
 if(m=='card'&&!w.card)w.card={last4:'4242'};
 _pick(i);if(!booking)return;pendI=-1;booking.fare=fr;
 const tx={id:refId(),ts:Date.now(),t:'trip',m,fare:fr,f:booking.f,tt:booking.t,st:m=='cash'?'cash':'hold'};
 if(m=='wallet'){w.bal-=fr;w.held+=fr}
 w.tx.unshift(tx);w.tx=w.tx.slice(0,60);booking.pay=tx;
 if(booking.hr){booking.hr.fare=fr;booking.hr.pay=tx}
 if(booking.rec){booking.rec.pm=m;lsSet('bookings',bookings)}
 saveAccs();drawAcct();$('bres').innerHTML=bookView();notifyStart(booking);
 if(m!='cash')toast('กันวงเงินไว้ '+baht(fr)+' แล้ว')}

/* --- ตัดเงินจริงเมื่อถึงที่หมาย / ยกเลิกแล้วคืนเงิน --- */
function settle(tx){const w=W();if(!tx||!w||tx.st!='hold')return;if(tx.m=='wallet')w.held=Math.max(0,w.held-tx.fare);tx.st='paid';tx.paidTs=Date.now();saveAccs();drawAcct();toast('ชำระเงิน '+baht(tx.fare)+' เรียบร้อย ✅')}
const _arr2=arrived;arrived=function(){const b=booking;if(b&&b.pay)settle(b.pay);_arr2()};
function cancelBk(){const b=booking,w=W();if(!b||b.done||!w)return;const tx=b.pay;let msg='ยกเลิกการจองแล้ว';
 if(tx&&tx.st=='hold'){if(tx.m=='wallet'){w.bal+=tx.fare;w.held=Math.max(0,w.held-tx.fare);msg+=' · คืนเงินเข้ากระเป๋า '+baht(tx.fare)}else msg+=' · ปล่อยวงเงิน '+baht(tx.fare);tx.st='refunded'}else if(tx&&tx.st=='cash')tx.st='void';
 if(b.hr)ACC.hist=(ACC.hist||[]).filter(x=>x.ts!==b.hr.ts);
 if(b.rec){const cx=lsGet('cxl')||[];cx.push(b.rec.ts);lsSet('cxl',cx.slice(-50));bookings=bookings.filter(x=>x.ts!==b.rec.ts);lsSet('bookings',bookings)}
 ACC.pts=Math.max(0,pts()-10);npClear();booking=null;chat={b:null,msgs:[]};saveAccs();drawAcct();toast(msg);go('book')}
const _bv=bookView;bookView=function(){const b=booking,h=_bv();if(!b||b.done||!b.pay)return h;const tx=b.pay,
 line=tx.m=='cash'?`💵 เงินสด ${baht(tx.fare)} · จ่ายพี่วินตอนถึงที่หมาย`:`🔒 ${PMN[tx.m]} · กันวงเงินไว้ ${baht(tx.fare)} · ตัดจริงเมื่อถึงที่หมาย · ไม่ต้องสแกน`;
 return h.replace('<button class="btn" onclick="openChat()">',`<div class="note">${line}</div><button class="btn" onclick="openChat()">`).replace('<div id="simres"','<button class="btn sec" onclick="cancelBk()">✖ ยกเลิกการจอง</button><div id="simres"')};

 return `<p><button class="btn sec" onclick="go('profile')">← โปรไฟล์</button></p><div class="banner"><span>👛</span><div><h2>กระเป๋าเงิน TU Win</h2><div class="mu">จ่ายค่าวินในแอปได้เลย ไม่ต้องสแกน ไม่ต้องเปิดแอปอื่น (จำลอง)</div></div></div>

 return h+`<div class="card" style="margin-top:12px"><h3>👛 สรุปการชำระเงิน</h3><div class="row"><span>ผ่านแอป</span><b>${baht(ap)}</b></div><div class="row"><span>เงินสด</span><b>${baht(ca)}</b></div><p><button class="btn sec" onclick="go('wallet')">ไปที่กระเป๋าเงิน</button></p></div>`};

 const c=`<h3>👛 กระเป๋ารายได้ในแอป</h3><div class="card"><div class="mu">ยอดที่ถอนได้ (ผู้โดยสารจ่ายผ่านแอป เข้าอัตโนมัติ)</div><div class="big2">฿${bal.toLocaleString(LOC())}</div><div class="mu">เงินสดที่รับเอง ฿${cash} · ถอนแล้ว ฿${wd}</div>${last?`<div class="mu">ถอนล่าสุด ฿${last.amt} · ${hhmm(last.ts)} (จำลอง)</div>`:''}<div style="margin-top:8px"><button class="btn big" ${bal>0?'':'disabled style="opacity:.4"'} onclick="drvWd()">ถอนเข้าบัญชี (จำลอง)</button></div></div>`,k='<h3>🎁 สวัสดิการและสินเชื่อ</h3>';return h.includes(k)?h.replace(k,c+k):h};
